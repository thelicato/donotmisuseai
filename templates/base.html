<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Do Not Misuse AI{% endblock title %}</title>
  <meta name="description" content="{% block description %}A manifesto identifying the domains where AI should not be used.{% endblock description %}">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Do Not Misuse AI{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}A manifesto identifying the domains where AI should not be used.{% endblock og_description %}">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) | safe }}">
  <meta property="og:site_name" content="Do Not Misuse AI">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% block tw_title %}Do Not Misuse AI{% endblock tw_title %}">
  <meta name="twitter:description" content="{% block tw_description %}A manifesto identifying the domains where AI should not be used.{% endblock tw_description %}">

  <link rel="canonical" href="{{ current_url | default(value=config.base_url) | safe }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,450;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,450;1,500;1,600;1,700&display=swap" rel="stylesheet">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{% block schema_type %}WebSite{% endblock schema_type %}",
    "name": "Do Not Misuse AI",
    "description": "A manifesto identifying the domains where AI should not be used.",
    "url": "{{ config.base_url }}"
  }
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' stroke='%23007aff' stroke-width='1.5' fill='none'/><path d='M16 7 L19 13 L25 16 L19 19 L16 25 L13 19 L7 16 L13 13 Z' fill='%23007aff'/><line x1='5' y1='27' x2='27' y2='5' stroke='%23ff3b30' stroke-width='2.5' stroke-linecap='round' opacity='0.8'/></svg>">

  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="{{ get_url(path='/') }}" class="navbar-logo">
        <img src="{{ get_url(path='logo.svg') }}" class="logo-icon" alt="Do Not Misuse AI">
        <span class="logo-text">Do Not Misuse AI</span>
      </a>
      <ul class="navbar-links">
        <li><a href="{{ get_url(path='/') }}">Manifesto</a></li>
        <li><a href="{{ get_url(path='/stories') }}">Stories</a></li>
        <li><a href="{{ get_url(path='/about') }}">About</a></li>
        <li>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock content %}
  </div>

  <div class="container">
    <footer>
      <p>&copy; {{ now() | date(format="%Y") }} Do Not Misuse AI</p>
      <div class="footer-links">
        <a href="{{ get_url(path='/about') }}">About</a>
        <a href="{{ config.extra.github_url }}" target="_blank" rel="noopener noreferrer">Contribute</a>
        <a href="{{ get_url(path='/privacy') }}">Privacy</a>
        <a href="{{ get_url(path='/license') }}">License</a>
      </div>
    </footer>
  </div>

  <script src="{{ get_url(path='theme.js') }}" defer></script>
</body>
</html>
